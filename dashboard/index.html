<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AeroTrack | Air Quality Dashboard</title>
<script>
(function () {
  try {
    var theme = localStorage.getItem('aerotrack-theme');
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme);
    }
  } catch (e) {}
})();
</script>
<style>
  :root {
    color-scheme: light;
    --surface-1: #ffffff;
    --surface-2: #f4f3ef;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #4a3aa7;
    --series-5: #d63b8f;
    --good: #0ca30c;
    --warning: #e8a300;
    --critical: #d03b3b;
    --muted-slot: #c3c2b7;
    --shadow: 0 1px 2px rgba(11,11,11,0.04), 0 8px 24px rgba(11,11,11,0.06);
    --grad-brand: linear-gradient(135deg, #2a78d6 0%, #1baf7a 55%, #ffb020 120%);
    --grad-header: linear-gradient(90deg, #2a78d6, #1baf7a 45%, #d63b8f 85%, #ffb020);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #17171a;
      --surface-2: #1e1e22;
      --page: #0c0c0e;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8b8a92;
      --grid: #2c2c2f;
      --axis: #3a3a3e;
      --border: rgba(255,255,255,0.10);
      --series-1: #4c9bef;
      --series-2: #ef8046;
      --series-3: #2dc98a;
      --series-4: #a493f2;
      --series-5: #ef6ab0;
      --good: #2dc98a;
      --warning: #f0b429;
      --critical: #ef6a6a;
      --muted-slot: #46454c;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 28px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #17171a;
    --surface-2: #1e1e22;
    --page: #0c0c0e;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8b8a92;
    --grid: #2c2c2f;
    --axis: #3a3a3e;
    --border: rgba(255,255,255,0.10);
    --series-1: #4c9bef;
    --series-2: #ef8046;
    --series-3: #2dc98a;
    --series-4: #a493f2;
    --series-5: #ef6ab0;
    --good: #2dc98a;
    --warning: #f0b429;
    --critical: #ef6a6a;
    --muted-slot: #46454c;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 28px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .accent-bar { height: 4px; background: var(--grad-header); }
  header {
    padding: 24px 32px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 13px;
    background: var(--grad-brand);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
  }
  .brand-mark svg { width: 25px; height: 25px; }
  h1 { font-size: 1.4rem; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: var(--text-secondary); font-size: 0.85rem; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .meta { color: var(--text-muted); font-size: 0.78rem; text-align: right; }

  .icon-btn, .pill-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-1); border: 1px solid var(--border);
    color: var(--text-secondary); border-radius: 999px;
    cursor: pointer; font-family: inherit; box-shadow: var(--shadow);
    transition: transform 0.12s ease, color 0.15s ease;
  }
  .icon-btn { width: 38px; height: 38px; justify-content: center; padding: 0; }
  .icon-btn svg { width: 18px; height: 18px; }
  .lang-btn { width: auto; padding: 0 12px; font-size: 0.76rem; font-weight: 700; letter-spacing: 0.03em; }
  .pill-btn { padding: 8px 14px; font-size: 0.78rem; font-weight: 600; text-decoration: none; }
  .icon-btn:hover, .pill-btn:hover { transform: translateY(-1px); color: var(--series-1); }
  .icon-btn .moon { display: none; }
  :root[data-theme="dark"] .icon-btn .sun { display: none; }
  :root[data-theme="dark"] .icon-btn .moon { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .icon-btn .sun { display: none; }
    :root:not([data-theme="light"]) .icon-btn .moon { display: block; }
  }

  main { padding: 0 32px 48px; max-width: 1180px; margin: 0 auto; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 16px; margin-bottom: 22px; box-shadow: var(--shadow);
  }
  .filters .group { display: flex; align-items: center; gap: 8px; }
  .filters label { font-size: 0.74rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .filters select, .filters input[type="search"] {
    font-family: inherit; font-size: 0.82rem; color: var(--text-primary);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px;
  }
  .filters .spacer { flex: 1; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .tile {
    position: relative; overflow: hidden;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease;
  }
  .tile:hover { transform: translateY(-2px); }
  .tile::before {
    content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px;
    background: var(--tile-color, var(--series-1));
  }
  .tile .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .tile .value { font-size: 1.65rem; font-weight: 600; margin-top: 4px; }
  .tile .value.critical { color: var(--critical); }
  .tile .sub { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }

  .tile.ring-tile { display: flex; align-items: center; gap: 14px; }
  .ring {
    --pct: 0;
    width: 56px; height: 56px; border-radius: 50%; flex: none;
    background: conic-gradient(var(--critical) calc(var(--pct) * 1%), var(--grid) 0);
    display: flex; align-items: center; justify-content: center;
  }
  .ring::after {
    content: ""; width: 40px; height: 40px; border-radius: 50%; background: var(--surface-1);
  }

  section.panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px 12px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .panel h2 { font-size: 0.95rem; margin: 0 0 2px; }
  .panel .desc { font-size: 0.78rem; color: var(--text-secondary); margin: 0 0 12px; }
  .chart-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .chart-box { position: relative; height: 220px; }
  @media (max-width: 760px) {
    .chart-row { grid-template-columns: 1fr; }
  }

  /* Heatmap / density map */
  .heat-legend { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 10px; }
  .heat-legend .bar {
    width: 120px; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, var(--good), var(--warning), var(--critical));
  }
  .heatmap {
    display: grid;
    grid-template-columns: 54px repeat(12, 1fr);
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 6px;
  }
  .heat-corner {}
  .heat-month-label, .heat-year-label {
    font-size: 0.68rem; color: var(--text-muted); text-align: center; align-self: center;
  }
  .heat-year-label { text-align: right; padding-right: 6px; font-weight: 600; transition: opacity 0.15s ease; }
  .heat-cell {
    aspect-ratio: 1 / 1; border-radius: 5px; min-width: 22px;
    background: color-mix(in srgb, var(--critical) calc(var(--t, 0) * 100%), var(--good));
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .heat-cell:hover { transform: scale(1.12); }
  .heat-cell.heat-empty { background: var(--grid); opacity: 0.5; }
  .heatmap.year-focus .heat-cell:not(.heat-active),
  .heatmap.year-focus .heat-year-label:not(.heat-active) { opacity: 0.25; }

  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-bottom: 8px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th { color: var(--text-muted); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--series-1); }
  th .arrow { opacity: 0.4; font-size: 0.65rem; margin-left: 3px; }
  th.sorted .arrow { opacity: 1; color: var(--series-1); }
  tbody tr { border-left: 3px solid transparent; }
  tbody tr:hover { background: color-mix(in srgb, var(--text-primary) 4%, transparent); }
  td.severity-cell { position: relative; }
  .severity-bar { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

  .legend-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.76rem; color: var(--text-secondary); margin-bottom: 6px; }
  .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

  .report-panel { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .report-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .report-preview {
    display: none; margin-top: 14px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    height: 70vh; max-height: 780px;
  }
  .report-preview.open { display: block; }
  .report-preview iframe { width: 100%; height: 100%; border: 0; background: var(--surface-2); }

  footer { padding: 24px 32px 40px; color: var(--text-muted); font-size: 0.76rem; text-align: center; }
  footer a { margin-left: 4px; }
  a { color: var(--series-1); }
</style>
</head>

<div class="accent-bar"></div>
<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 12c3-4 6 4 9 0s6-4 9 0" stroke="white" stroke-width="2" stroke-linecap="round"/>

<main>
  <div class="filters">
    <div class="group">

  <div class="tiles" id="tiles"></div>

  <section class="panel">

const I18N = {

let data = null;
let charts = {};
let lang = 'en';
const c = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const t = (key) => I18N[lang][key];
const monthName = m => I18N[lang].months[m];

function verticalGradient(ctx, chartArea, colorHex) {
  if (!chartArea) return colorHex;
  const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
  g.addColorStop(0, colorHex + 'aa');
  g.addColorStop(1, colorHex + '05');
  return g;
}

  document.getElementById('lblMetric').textContent = t('lblMetric');

function renderTiles() {
  const g = data.indicadores_gerais;
  const pct = g.percentual_horas_criticas;
  const loc = t('locale');
  const tiles = [
    { label: t('tileTreated'), value: g.total_leituras.toLocaleString(loc), color: 'var(--series-1)' },
    { label: t('tileRejected'), value: data.registros_rejeitados.toLocaleString(loc),
      sub: t('tileRejectedSub'), color: 'var(--series-4)' },
    { label: t('tileCo'), value: g.co_medio_geral, sub: t('tileMax') + ' ' + g.co_maximo_geral, color: 'var(--series-2)' },
    { label: t('tileNo2'), value: g.no2_medio_geral, sub: t('tileMax') + ' ' + g.no2_maximo_geral, color: 'var(--series-3)' },
    { label: t('tileTemp'), value: g.temperatura_media_geral + ' °C', color: 'var(--series-5)' },
    { label: t('tileHumidity'), value: g.umidade_media_geral + '%', color: 'var(--series-1)' },
  ];
  const ringTile = `
    <div class="tile ring-tile" style="--tile-color:var(--critical)">
      <div class="ring" style="--pct:${pct}"></div>
      <div>
        <div class="label">${t('tileCritical')}</div>
        <div class="value critical">${pct}%</div>
      </div>
    </div>`;
  document.getElementById('tiles').innerHTML = ringTile + tiles.map(tl => `
    <div class="tile" style="--tile-color:${tl.color}">
      <div class="label">${tl.label}</div>
      <div class="value">${tl.value}</div>
      ${tl.sub ? `<div class="sub">${tl.sub}</div>` : ''}
    </div>`).join('');
}

function filteredMonthly(year) {
  return year === 'all' ? data.evolucao_mensal : data.evolucao_mensal.filter(r => String(r.ano) === year);
}

function renderMonthlyCharts(year) {
  const rows = filteredMonthly(year);
  const labels = rows.map(r => monthName(r.mes) + '/' + String(r.ano).slice(2));

  function lineChart(key, canvasId, field, colorVar, yLabel) {
    const color = c(colorVar);
    if (charts[key]) charts[key].destroy();
    charts[key] = new Chart(document.getElementById(canvasId), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: rows.map(r => r[field]),
          borderColor: color,
          backgroundColor: (ctx) => verticalGradient(ctx.chart.ctx, ctx.chart.chartArea, color),
          borderWidth: 2.5,
          pointRadius: 3,
          pointHoverRadius: 5,
          pointBackgroundColor: color,
          tension: 0.3,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, title: { display: true, text: yLabel, align: 'start', color: c('--text-primary'), font: { size: 12, weight: '600' } } },
        scales: {
          x: { grid: { display: false }, ticks: { color: c('--text-muted'), font: { size: 10 } } },
          y: { grid: { color: c('--grid') }, ticks: { color: c('--text-muted'), font: { size: 10 } } }
        }
      }
    });
  }
  lineChart('coMonthly', 'chartCoMonthly', 'co_medio', '--series-1', t('tileCo'));
  lineChart('no2Monthly', 'chartNo2Monthly', 'no2_medio', '--series-2', t('tileNo2'));
}

function renderHeatmap(metric) {
  const rows = data.evolucao_mensal;
  const years = [...new Set(rows.map(r => r.ano))].sort();
  const byYearMonth = {};
  rows.forEach(r => { byYearMonth[r.ano + '-' + r.mes] = r; });
  const values = rows.map(r => r[metric]);
  const max = Math.max(...values), min = Math.min(...values);

  let html = '<div class="heat-corner"></div>';
  for (let m = 1; m <= 12; m++) html += `<div class="heat-month-label">${monthName(m)}</div>`;
  years.forEach(y => {
    html += `<div class="heat-year-label" data-year="${y}">${y}</div>`;
    for (let m = 1; m <= 12; m++) {
      const rec = byYearMonth[y + '-' + m];
      if (!rec) { html += `<div class="heat-cell heat-empty"></div>`; continue; }
      const v = rec[metric];
      const tt = max === min ? 0.5 : (v - min) / (max - min);
      html += `<div class="heat-cell" data-year="${y}" style="--t:${tt.toFixed(3)}" title="${monthName(m)}/${y}: ${v}"></div>`;
    }
  });
  const grid = document.getElementById('heatmapGrid');
  grid.innerHTML = html;
  applyYearFocus(document.getElementById('filterYear').value);
}

function applyYearFocus(year) {
  const grid = document.getElementById('heatmapGrid');
  if (year === 'all') {
    grid.classList.remove('year-focus');
    return;
  }
  grid.classList.add('year-focus');
  grid.querySelectorAll('[data-year]').forEach(el => {
    el.classList.toggle('heat-active', el.getAttribute('data-year') === year);
  });
}

function levelChart(key, canvasId, dist) {
  const order = ['BOM', 'MODERADO', 'CRITICO', 'SEM_DADO'];
  const labelFor = { BOM: t('levelGood'), MODERADO: t('levelModerate'), CRITICO: t('levelCritical'), SEM_DADO: t('levelNoData') };
  const colorFor = { BOM: c('--good'), MODERADO: c('--warning'), CRITICO: c('--critical'), SEM_DADO: c('--muted-slot') };
  const byLevel = Object.fromEntries(dist.map(d => [d[Object.keys(d)[0]], d.quantidade]));
  const present = order.filter(n => byLevel[n] !== undefined);
  if (charts[key]) charts[key].destroy();
  charts[key] = new Chart(document.getElementById(canvasId), {
    type: 'bar',
    data: {
      labels: present.map(n => labelFor[n]),
      datasets: [{
        data: present.map(n => byLevel[n]),
        backgroundColor: present.map(n => colorFor[n]),
        borderRadius: 6,
        maxBarThickness: 46,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { color: c('--text-muted'), font: { size: 10 } } },
        y: { grid: { color: c('--grid') }, ticks: { color: c('--text-muted'), font: { size: 10 } } }
      }
    }
  });
}

function renderShiftChart() {
  const shiftOrder = ['MADRUGADA', 'MANHA', 'TARDE', 'NOITE'];
  const shiftLabels = [t('shiftNight'), t('shiftMorning'), t('shiftAfternoon'), t('shiftEvening')];
  const shiftColors = [c('--series-1'), c('--series-2'), c('--series-3'), c('--series-4')];
  const shiftByName = Object.fromEntries(data.leituras_por_turno.map(tt => [tt.turno, tt.quantidade]));
  if (charts.shift) charts.shift.destroy();
  charts.shift = new Chart(document.getElementById('chartShift'), {
    type: 'bar',
    data: {
      labels: shiftLabels,
      datasets: [{
        data: shiftOrder.map(tt => shiftByName[tt] || 0),
        backgroundColor: shiftColors,
        borderRadius: 6,
        maxBarThickness: 60,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: c('--grid') }, ticks: { color: c('--text-muted'), font: { size: 10 } } },
        y: { grid: { display: false }, ticks: { color: c('--text-muted'), font: { size: 10 } } }
      }
    }
  });
}

let rankingSort = { key: null, dir: 1 };
function renderRankingTable() {
  const search = document.getElementById('rankingSearch').value.trim().toLowerCase();
  let rows = data.ranking_piores_dias.filter(r => !search || r.data_referencia.toLowerCase().includes(search));
  if (rankingSort.key) {
    rows = [...rows].sort((a, b) => {
      const av = a[rankingSort.key], bv = b[rankingSort.key];
      return av > bv ? rankingSort.dir : av < bv ? -rankingSort.dir : 0;
    });
  }
  const critical = c('--critical'), good = c('--good'), loc = t('locale');
  const tbody = document.querySelector('#rankingTable tbody');
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${new Date(r.data_referencia).toLocaleDateString(loc)}</td>
      <td>${r.co_medio}</td>
      <td>${r.no2_medio}</td>
      <td>${r.horas_condicao_critica}</td>
      <td class="severity-cell"><span class="severity-bar" style="background:color-mix(in srgb, ${critical} ${r.percentual_horas_criticas}%, ${good})"></span>${r.percentual_horas_criticas}%</td>
    </tr>`).join('') || `<tr><td colspan="5" style="color:var(--text-muted)">${t('noMatch')}</td></tr>`;

  document.querySelectorAll('#rankingTable th').forEach(th => {
    th.classList.toggle('sorted', th.dataset.key === rankingSort.key);
    th.querySelector('.arrow').innerHTML = th.dataset.key === rankingSort.key && rankingSort.dir === -1 ? '&#9652;' : '&#9662;';
  });
}

function renderAll() {
  applyStaticText();
  Chart.defaults.locale = t('locale');
  renderTiles();
  renderMonthlyCharts(document.getElementById('filterYear').value);
  renderHeatmap(document.getElementById('filterMetric').value);
  levelChart('coLevel', 'chartCoLevel', data.distribuicao_co_nivel);
  levelChart('no2Level', 'chartNo2Level', data.distribuicao_no2_nivel);
  renderShiftChart();
  renderRankingTable();
}

function setupFilters() {
  const years = [...new Set(data.evolucao_mensal.map(r => String(r.ano)))].sort();
  const yearSelect = document.getElementById('filterYear');
  const rebuildYearOptions = () => {
    const current = yearSelect.value || 'all';
    yearSelect.innerHTML = `<option value="all">${t('allYears')}</option>` + years.map(y => `<option value="${y}">${y}</option>`).join('');
    yearSelect.value = current;
  };
  rebuildYearOptions();
  yearSelect.addEventListener('change', () => {
    renderMonthlyCharts(yearSelect.value);
    applyYearFocus(yearSelect.value);
  });

  document.getElementById('filterMetric').addEventListener('change', (e) => renderHeatmap(e.target.value));
  document.getElementById('rankingSearch').addEventListener('input', renderRankingTable);

  document.querySelectorAll('#rankingTable th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      rankingSort.dir = rankingSort.key === key ? -rankingSort.dir : 1;
      rankingSort.key = key;
      renderRankingTable();
    });
  });

  document.getElementById('togglePreview').addEventListener('click', () => {
    const box = document.getElementById('reportPreview');
    const open = box.classList.toggle('open');
    document.getElementById('togglePreview').textContent = open ? t('hidePreview') : t('showPreview');
    if (open) {
      const frame = document.getElementById('reportFrame');
      if (!frame.src) frame.src = '../docs/evidencias/relatorio-desenvolvimento-aerotrack.pdf';
    }
  });

  document.getElementById('themeToggle').addEventListener('click', () => {
    const root = document.documentElement;
    const isDark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('aerotrack-theme', next); } catch (e) {}
    Chart.defaults.color = c('--text-secondary');
    Chart.defaults.borderColor = c('--grid');
    renderAll();
  });

  document.getElementById('langToggle').addEventListener('click', () => {
    lang = lang === 'en' ? 'pt' : 'en';
    try { localStorage.setItem('aerotrack-lang', lang); } catch (e) {}
    renderAll();
    rebuildYearOptions();
  });
}

async function main() {
  try {
    const saved = localStorage.getItem('aerotrack-lang');
    if (saved === 'en' || saved === 'pt') lang = saved;
    else if ((navigator.language || '').toLowerCase().startsWith('pt')) lang = 'pt';
  } catch (e) {}

  const res = await fetch('data/indicadores.json');
  data = await res.json();

  Chart.defaults.font.family = "system-ui, -apple-system, 'Segoe UI', sans-serif";
  Chart.defaults.color = c('--text-secondary');
  Chart.defaults.borderColor = c('--grid');

  setupFilters();
  renderAll();
}
main();
</script>
